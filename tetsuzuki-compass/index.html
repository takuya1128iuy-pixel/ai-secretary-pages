/* 端末が暗い設定のときの色。トークンだけ差し替える */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #b9c2ff;
    --brand-soft: #9aa6f5;
    --accent: #8f9dff;
    --accent-active: #a8b3ff;
    --on-accent: #0b1030;
    --bg: #0e1620;
    --card: #16212e;
    --surface: #1b2735;
    --header-bg: rgba(14, 22, 32, .95);
    --pill-bg: #232a4d;
    --focus: #3a4480;
    --line: #26364a;
    --text: #e6edf5;
    --muted: #97a6b8;
    --ok-bg: #13342350;
    --ok-fg: #62c78d;
    --warn-bg: #3a2c1250;
    --warn-fg: #e0b264;
    --brand-mark: var(--mark-on-dark);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}

:root[data-theme="dark"] {
  --brand-mark: var(--mark-on-dark);
  --brand: #b9c2ff;
  --brand-soft: #9aa6f5;
  --accent: #8f9dff;
  --accent-active: #a8b3ff;
  --on-accent: #0b1030;
  --bg: #0e1620;
  --card: #16212e;
  --surface: #1b2735;
  --header-bg: rgba(14, 22, 32, .95);
  --pill-bg: #232a4d;
  --focus: #3a4480;
  --line: #26364a;
  --text: #e6edf5;
  --muted: #97a6b8;
  --ok-bg: #13342350;
  --ok-fg: #62c78d;
  --warn-bg: #3a2c1250;
  --warn-fg: #e0b264;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}


* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

/* ヘッダー */
.site-header {
  position: sticky; top: 0; z-index: 10;
  background: var(--header-bg);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { padding-top: 12px; padding-bottom: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; color: var(--brand); }
.brand-mark { width: 28px; height: 28px; flex: none; background: var(--brand-mark) center / contain no-repeat; }
.nav { display: flex; gap: 20px; margin-top: 10px; }
.nav button {
  appearance: none; background: none; border: 0; padding: 8px 0 10px;
  font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
}
.nav button[aria-current="true"] { color: var(--brand); font-weight: 700; border-bottom-color: var(--accent); }

/* ステップ表示 */
.steps { display: flex; align-items: center; gap: 6px; margin: 20px 0 18px; }
.step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.step .num {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: var(--surface); color: var(--muted); border: 1px solid var(--line);
}
.step .cap { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step[data-state="current"] .num { background: var(--brand); color: var(--bg); border-color: var(--brand); }
.step[data-state="current"] .cap { color: var(--brand); font-weight: 700; }
.step[data-state="done"] .num { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-bg); }
.step .bar { flex: 1; height: 1px; background: var(--line); }

/* カード */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 14px;
}
h1 { font-size: 22px; margin: 4px 0 8px; letter-spacing: .01em; }
h2 { font-size: 17px; margin: 0 0 12px; }
p.lead { color: var(--muted); margin: 0 0 4px; font-size: 14px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--pill-bg); color: var(--brand-soft);
  font-size: 12px; padding: 5px 11px; border-radius: 999px;
}

/* 手続きの一覧 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .tiles { grid-template-columns: 1fr; } }
.tile {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; cursor: pointer; font: inherit; color: inherit;
  transition: border-color .15s, transform .1s;
}
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.99); }
.tile .ic { font-size: 26px; line-height: 1; }
.tile .t { font-weight: 700; font-size: 15px; }
.tile .d { font-size: 12px; color: var(--muted); }

/* 会社の一覧 */
.search {
  width: 100%; padding: 12px 14px; font: inherit;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: inherit;
}
.search:focus { outline: 2px solid var(--focus); border-color: var(--accent); }
.list { list-style: none; margin: 12px 0 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.row {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: none; border: 0; padding: 14px 4px; font: inherit; color: inherit;
  cursor: pointer; text-align: left;
}
.row .nm { font-weight: 600; }
.row .arrow { color: var(--muted); flex: none; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.direct { background: var(--ok-bg); color: var(--ok-fg); }
.badge.list { background: var(--warn-bg); color: var(--warn-fg); }
.empty { color: var(--muted); font-size: 14px; padding: 18px 4px; }

/* 結果 */
.result-head { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.result-head .ic { font-size: 24px; }
.cta {
  display: block; text-align: center; text-decoration: none;
  background: var(--accent); color: var(--on-accent); font-weight: 700;
  padding: 15px 16px; border-radius: 12px; margin: 14px 0 10px;
}
.cta:active { background: var(--accent-active); }
.sub-links { display: grid; gap: 8px; }
.sub-link {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-decoration: none; color: var(--brand-soft); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; font-size: 14px; background: var(--surface);
}
.sub-note { display: block; font-size: 12px; color: var(--muted); line-height: 1.45; }
.note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.back {
  appearance: none; background: none; border: 0; padding: 10px 0; font: inherit;

  border-radius: 6px;
}

  * { transition: none !important; }
}

/* 屋号・担当者名（ヘッダー） */
.brand-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }

/* リンクの保守について（お客さま向けの言葉づかいで、控えめに置く） */
.link-note {
  font-size: 13px; color: var(--muted); margin: 12px 0 0;
  padding-top: 12px; border-top: 1px solid var(--line);
}

/* 手続きの前に知っておきたいこと */
.info { display: grid; gap: 16px; margin: 4px 0 0; }
.info--divided { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.info-title { font-size: 15px; margin: 0; color: var(--brand); }
.info h3 {
  font-size: 13px; margin: 0 0 6px; color: var(--muted);
  letter-spacing: .04em; font-weight: 700;
}
.info ul { margin: 0; padding-left: 1.2em; }
.info li { font-size: 14px; margin-bottom: 4px; }
.info p { margin: 0; font-size: 14px; }

/* 担当者に相談する */
.consult {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; font-weight: 700; font-size: 15px;
  color: var(--brand); background: var(--pill-bg);
  border: 1px solid var(--focus); border-radius: 12px;
  padding: 14px 16px; margin-top: 14px;
}
.consult:active { filter: brightness(.96); }

/* 商談用の配色切り替え（?preview=1 のときだけ出る） */
.palette-picker {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border: 1px dashed var(--line); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 14px;
}
.palette-picker .cap { font-size: 12px; color: var(--muted); }
.palette-picker button {
  font: inherit; font-size: 13px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: inherit;
  border-radius: 999px; padding: 5px 12px;
}
.palette-picker button[aria-pressed="true"] {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}

/* 募集人モード */
:root[data-mode="pro"] .brand-sub { color: var(--brand-soft); font-weight: 700; }
.pro h2 { margin-bottom: 4px; }
.pro-field { display: block; margin: 12px 0; }
.pro-field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.draft {
  width: 100%; margin-top: 12px; padding: 12px 14px;
  font: inherit; font-size: 14px; line-height: 1.7;
  color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  resize: vertical;
}
.draft:focus { outline: 2px solid var(--focus); border-color: var(--accent); }
.pro-actions { display: grid; gap: 8px; margin-top: 12px; }
.pro-actions .cta, .pro-actions .consult { margin: 0; width: 100%; cursor: pointer; font-family: inherit; }

<script>
/* テナント（提供先）ごとの設定
 *
 * 1つのページを複数の担当者・代理店で使い回すための設定。
 * URL の ?c=<id> で切り替える。指定が無ければ default。
 *
 *   /?c=sample              サンプル事務所の設定で開く
 *   /?c=sample&theme=plum   配色だけ差し替えて見せる（提案時のデモ用）
 *   /?preview=1             配色を切り替えるボタンを出す（商談で色を選んでもらう用）
 *
 * palette に使える値は PALETTES を参照。
 * lineId を入れると「担当者に相談する」ボタンが出る（未設定なら出ない）。
 */
var PALETTES = [
  { id: 'indigo', label: '藍' },
  { id: 'teal', label: '青緑' },
  { id: 'plum', label: '梅' },
  { id: 'amber', label: '琥珀' },
  { id: 'slate', label: '鉄紺' },
];

var TENANTS = {
  default: {
    siteName: 'てつづきコンパス',
    tagline: '保険のお手続き案内',
    org: '',
    agent: '',
    palette: 'indigo',
    lineId: '@489xybid', // 相談ボタンの飛び先（LINE公式アカウントのベーシックID）
    consultLabel: '担当者に相談する',
  },

  // 提案・デモ用のサンプル。実在の事務所ではない。
  sample: {
    siteName: 'てつづきコンパス',
    tagline: '保険のお手続き案内',
    org: 'みらい保険サービス',
    agent: '山田',
    palette: 'teal',
    lineId: '',
    consultLabel: '山田に相談する',
  },
};

function resolveTenant(params) {
  var t = TENANTS[params.get('c')] || TENANTS.default;
  var tenant = {};
  for (var k in TENANTS.default) tenant[k] = TENANTS.default[k];
  for (var k2 in t) tenant[k2] = t[k2];

  // ?theme= は配色だけの上書き。商談中に色を見せ替えるために使う。
  var theme = params.get('theme');
  if (theme && PALETTES.some(function (p) { return p.id === theme; })) tenant.palette = theme;

  return tenant;
}

      tel: '0120-81-8107', telNote: 'お客さまサービスセンター（一時払商品）平日9:00〜17:00',
      telSource: 'https://www.ms-primary.com/customer/',
      top: 'https://www.ms-primary.com/customer/guidebook/',
      links: {
        certificate: 'https://www.ms-primary.com/customer/certificate/',
      },
    },
    {
      id: 'd-frontier', name: '第一フロンティア生命',
      // 商品で窓口が分かれている。一時払商品 0120-876-126、平準払商品 0120-765-228。
      // 銀行窓販の主力である一時払のほうを採る（三井住友海上プライマリー生命と同じ）。
      // 受付時間は、お問い合わせページが0120番号のそばには書いておらず、
      // 同じお客さまサービスセンターの海外用 042-716-6040 と、チャットの
      // オペレーター受付時間として2か所に「平日9:00〜17:00」と書いてある。
      tel: '0120-876-126', telNote: 'お客さまサービスセンター（一時払商品）平日9:00〜17:00',
      telSource: 'https://www.d-frontier-life.co.jp/contact/index.html',
      extraTels: {
        loan: { tel: '0120-654-823', note: '解約試算・請求書専用 自動応答ダイヤル 平日8:00〜20:00' },
      },
      portal: { name: 'マイページ', url: 'https://www.d-frontier-life.co.jp/customer/internet-service/index.html' },
      top: 'https://www.d-frontier-life.co.jp/customer/information/index.html',
    },
    {
      id: 'zurichlife', name: 'チューリッヒ生命',
      tel: '0120-236-523', telNote: 'カスタマーケアセンター 月〜土9:00〜18:00',
      telSource: 'https://www.zurichlife.co.jp/inquiry/contractor',
      portal: { name: 'マイページ（Z-Life）', url: 'https://www.zurichlife.co.jp/customer/z-life/' },
      top: 'https://www.zurichlife.co.jp/vivr/list',
      links: {
        address: 'https://www.zurichlife.co.jp/customer/z-life/guide/address',
      },
    },
  ],
};

if (typeof module !== 'undefined') module.exports = HOKEN;
</script>
<script>
/* てつづきコンパス
 * 「手続きを選ぶ → 保険会社を選ぶ → 方法を確認」の3ステップ。
 *
 * URLで状態を持つので、LINEのリッチメニューから直接その手続きへ飛ばせる。
 *   ?p=payment            … 手続きを指定して会社選択から始める
 *   ?p=payment&c=orixlife … 結果画面を直接開く
 *   （#/p/payment/c/orixlife の形も同じ意味で受け付ける）
 *
 * 提供先ごとの設定は tenants.js。?c= で切り替える。
 *   ?c=sample &theme=plum &preview=1
 */
(function () {
  'use strict';

  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var tenant = resolveTenant(params);
  var previewMode = params.get('preview') === '1';

  // 募集人モード。/pro/ に置く版はビルド時に APP_MODE が埋め込まれる。
  // 手元で試すときは ?mode=pro でも切り替わる。
  var isPro = (typeof APP_MODE !== 'undefined' && APP_MODE === 'pro') || params.get('mode') === 'pro';
  var customerName = '';

  var byId = function (list, id) { return list.filter(function (x) { return x.id === id; })[0]; };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var list = function (items) {
    return '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  };

  var state = { view: 'top', procedure: null, company: null, query: '' };

  // ---- 見た目とテナント --------------------------------------------------
  function applyTenant() {
    document.documentElement.setAttribute('data-palette', tenant.palette);
    document.title = tenant.org ? tenant.siteName + '｜' + tenant.org : tenant.siteName;

    var brand = document.querySelector('.brand .brand-name');
    if (brand) brand.textContent = tenant.siteName;
    var sub = document.querySelector('.brand .brand-sub');
    if (sub) sub.textContent = isPro ? [tenant.org, '募集人向け'].filter(Boolean).join('・') : (tenant.org || '');
    if (isPro) {
      document.documentElement.setAttribute('data-mode', 'pro');
      // 使うのが募集人自身なので、担当者への相談導線は出さない
      var contactTab = document.querySelector('.nav button[data-nav="contact"]');
      if (contactTab) contactTab.remove();
    }
  }

  // ---- URL との同期 ------------------------------------------------------
  function readUrl() {
    var p = params.get('p');
    var c = params.get('c') && byId(HOKEN.companies, params.get('c')) ? params.get('c') : null;
    var m = location.hash.match(/^#\/p\/([\w-]+)(?:\/c\/([\w-]+))?/);
    if (m) { p = m[1]; c = m[2] || null; }
    if (!p) return;
    var proc = byId(HOKEN.procedures, p);
    if (!proc) return;
    state.procedure = proc;
    state.view = 'companies';
    if (c) {
      var comp = byId(HOKEN.companies, c);
      if (comp) { state.company = comp; state.view = 'result'; }
    }
  }

  function writeUrl() {
    var hash = '';
    if (state.procedure) {
      hash = '#/p/' + state.procedure.id;
      if (state.company && state.view === 'result') hash += '/c/' + state.company.id;
    }
    if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
  }

  // ---- 部品 --------------------------------------------------------------
  function stepper(current) {
    var caps = ['手続きを選ぶ', '会社を選ぶ', '方法を確認'];
    var html = '<div class="steps">';
    for (var i = 0; i < 3; i++) {
      var st = i + 1 === current ? 'current' : (i + 1 < current ? 'done' : 'todo');
      html += '<div class="step" data-state="' + st + '">' +
        '<span class="num">' + (st === 'done' ? '✓' : i + 1) + '</span>' +
        '<span class="cap">' + caps[i] + '</span></div>';
      if (i < 2) html += '<span class="bar"></span>';
    }
    return html + '</div>';
  }

  // リンクを保守していることは伝えたいが、確認件数や日付は運用側の言葉なので出さない。
  // 切れていたら教えてもらう、という導線にしておく。
  function linkNote() {
    // 募集人向けでは、読む人自身が担当者なので宛先を書かない
    var to = isPro ? '' : esc(tenant.agent || '担当者') + 'まで';
    return '<p class="link-note">各保険会社のリンクは随時確認しておりますが、' +
      'つながらない場合は' + to + 'お知らせください。</p>';
  }

  // 商談中に配色を見せ替えるための切り替え。?preview=1 のときだけ出す。
  function palettePicker() {
    if (!previewMode) return '';
    return '<div class="palette-picker"><span class="cap">配色</span>' +
      PALETTES.map(function (p) {
        return '<button type="button" data-palette="' + p.id + '" aria-pressed="' +
          (p.id === tenant.palette) + '">' + esc(p.label) + '</button>';
      }).join('') + '</div>';
  }

  // 会社がその手続きの専用ページを持っているか
  function linkFor(company, procedureId) {
    if (company.links && company.links[procedureId]) {
      return { url: company.links[procedureId], kind: 'direct' };
    }
    return { url: company.top, kind: 'list' };
  }

  // LINEのトークに戻って、用件が入った状態でメッセージを送れるようにする。
  // 送信するかどうかは本人が決める（勝手には送られない）。
  function consultLink(procedure, company) {
    if (!tenant.lineId) return '';
    var text = procedure
      ? procedure.label + 'について相談したいです' + (company ? '（' + company.name + '）' : '')
      : '保険の手続きについて相談したいです';
    var url = 'https://line.me/R/oaMessage/' + tenant.lineId + '/?' + encodeURIComponent(text);
    return '<a class="consult" href="' + esc(url) + '">💬 ' + esc(tenant.consultLabel) + '</a>';
  }

  // お客様に送る文面を組み立てる。募集人がそのままコピーして送れる形にする。
  // 商品説明は入れない（手続きの案内に限る）。
  function draftMessage(p, c) {
    var l = linkFor(c, p.id);
    var lines = [];
    if (customerName) lines.push(customerName + '様');
    lines.push(c.name + 'の「' + p.label + '」のお手続きです。');
    lines.push('');
    lines.push('▼お手続きはこちら');
    lines.push(l.url);
    if (l.kind === 'list') lines.push('（一覧から「' + p.label + '」をお選びください）');

    if (p.needs && p.needs.length) {
      lines.push('');
      lines.push('▼ご用意いただくもの');
      p.needs.forEach(function (n) { lines.push('・' + n); });
    }

    var dedicated = c.extraTels && c.extraTels[p.id];
    if (dedicated || c.tel) {
      lines.push('');
      lines.push('▼お電話の場合');
      if (dedicated) lines.push(dedicated.tel + '（' + dedicated.note + '）');
      if (c.tel) lines.push(c.tel + '（' + (c.telNote || '電話窓口') + '）');
    }

    if (p.duration) {
      lines.push('');
      lines.push('▼目安');
      lines.push(p.duration);
    }

    lines.push('');
    lines.push('ご不明な点があれば、このままご返信ください。');
    return lines.join('\n');
  }

  // 募集人向けの操作パネル。文面はその場で直してから送れるようにしておく。
  function proPanel(p, c) {
    return '<div class="card pro">' +
      '<h2>お客様に送る文面</h2>' +
      '<label class="pro-field"><span>お客様のお名前（任意）</span>' +
      '<input class="search" id="who" type="text" placeholder="例: 山田" value="' + esc(customerName) + '"></label>' +
      '<textarea class="draft" id="draft" rows="16">' + esc(draftMessage(p, c)) + '</textarea>' +
      '<div class="pro-actions">' +
        '<button class="cta" type="button" id="copy">この文面をコピー</button>' +
        '<button class="consult" type="button" id="share">LINEで送る</button>' +
      '</div>' +
      '<p class="note">送る前に文面を直せます。お客様の情報はこの端末の中だけで扱われ、どこにも送信されません。</p>' +
      '</div>';
  }

  // 番号は用途が限られることがあるので、何の窓口かを必ず添える
  function telLink(tel, note) {
    return '<a class="sub-link" href="tel:' + esc(tel.replace(/-/g, '')) + '">' +
      '<span>' + esc(tel) + '<br><span class="sub-note">' + esc(note) + '</span></span>' +
      '<span>›</span></a>';
  }

  // ---- 画面 --------------------------------------------------------------
  function viewTop() {
    var pill = isPro ? '入力した内容はこの端末から出ません' : '個人情報の入力は一切不要です';
    var lead = isPro
      ? 'お客様へご案内ご希望の手続きをお選びください。会社を選ぶと、お客様に送る文面が組み上がります。'
      : 'ご希望のお手続きを選択してください。ご加入中の保険会社のお手続き方法をご案内します。';
    return palettePicker() + stepper(1) +
      '<div class="card">' +
        '<span class="pill">' + pill + '</span>' +
        '<h1>' + esc(tenant.siteName) + '</h1>' +
        '<p class="lead">' + lead + '</p>' +
        linkNote() +
      '</div>' +
      '<h2>手続きを選ぶ</h2>' + tiles();
  }

  function tiles() {
    return '<div class="tiles">' + HOKEN.procedures.map(function (p) {
      return '<button class="tile" type="button" data-proc="' + p.id + '">' +
        '<span class="ic">' + p.icon + '</span>' +
        '<span><span class="t">' + esc(p.label) + '</span><br>' +
        '<span class="d">' + esc(p.desc) + '</span></span></button>';
    }).join('') + '</div>';
  }

  function viewCompanies() {
    var p = state.procedure;
    var q = state.query.trim();
    var hits = HOKEN.companies.filter(function (c) { return !q || c.name.indexOf(q) >= 0; });

    var rows = hits.map(function (c) {
      var l = linkFor(c, p.id);
      var badge = l.kind === 'direct'
        ? '<span class="badge direct">Webで手続き可能</span>'
        : '<span class="badge list">お手続き一覧から</span>';
      return '<li><button class="row" type="button" data-company="' + c.id + '">' +
        '<span class="nm">' + esc(c.name) + '</span>' +
        '<span>' + badge + ' <span class="arrow">›</span></span></button></li>';
    }).join('');

    return stepper(2) +
      '<button class="back" type="button" data-back="top">← 手続きを選びなおす</button>' +
      '<div class="card">' +
        '<div class="result-head"><span class="ic">' + p.icon + '</span><h2 style="margin:0">' + esc(p.label) + '</h2></div>' +
        '<p class="lead">' + esc(p.desc) + '</p>' +
        infoBlock(p, { divider: true }) +
      '</div>' +
      '<h2>ご加入中の保険会社を選ぶ</h2>' +
      '<input class="search" id="q" type="search" placeholder="会社名で絞り込む（例: オリックス）" value="' + esc(state.query) + '">' +
      (rows ? '<ul class="list">' + rows + '</ul>'
            : '<p class="empty">該当する保険会社が見つかりませんでした。会社名を短く入れてお試しください。</p>');
  }

  // リンク先に進む前に知っておきたいこと。会社ごとの差はあるので目安として出す。
  // 見出しはお客さまが読む言葉づかいに合わせる。
  function infoBlock(p, opts) {
    if (!p.needs && !p.duration) return '';
    var o = opts || {};
    var html = '<div class="info' + (o.divider ? ' info--divided' : '') + '">';
    html += '<h2 class="info-title">お手続きの前に</h2>';
    if (p.needs) html += '<div><h3>ご用意いただくもの</h3>' + list(p.needs) + '</div>';
    if (p.duration) html += '<div><h3>所要時間の目安</h3><p>' + esc(p.duration) + '</p></div>';
    return html + '</div>';
  }

  function viewResult() {
    var p = state.procedure, c = state.company;
    var l = linkFor(c, p.id);
    var head = l.kind === 'direct'
      ? '<span class="badge direct">このお手続きの案内ページがあります</span>'
      : '<span class="badge list">会社のお手続き一覧からお選びください</span>';

    var subs = '';
    if (c.portal && c.portal.url) {
      subs += '<a class="sub-link" href="' + esc(c.portal.url) + '" target="_blank" rel="noopener">' +
        '<span>' + esc(c.portal.name) + '（契約者向けサービス）</span><span>›</span></a>';
    }
    if (l.url !== c.top) {
      subs += '<a class="sub-link" href="' + esc(c.top) + '" target="_blank" rel="noopener">' +
        '<span>お手続き一覧をすべて見る</span><span>›</span></a>';
    }
    // その手続き専用のダイヤルがある会社は、代表番号より先に出す
    var dedicated = c.extraTels && c.extraTels[p.id];
    if (dedicated) subs += telLink(dedicated.tel, dedicated.note);
    if (c.tel) subs += telLink(c.tel, c.telNote || '電話窓口');

    // 募集人モードでは、送る文面が主役なので先頭に出す
    return stepper(3) +
      '<button class="back" type="button" data-back="companies">← 保険会社を選びなおす</button>' +
      (isPro ? proPanel(p, c) : '') +
      '<div class="card">' +
        '<div class="result-head"><span class="ic">' + p.icon + '</span>' +
        '<div><h2 style="margin:0">' + esc(c.name) + '</h2>' +
        '<p class="lead" style="margin:0">' + esc(p.label) + '</p></div></div>' +
        '<p style="margin:12px 0 0">' + head + '</p>' +
        '<a class="cta" href="' + esc(l.url) + '" target="_blank" rel="noopener">公式サイトでお手続きへ</a>' +
        '<div class="sub-links">' + subs + '</div>' +
        (isPro ? '' : consultLink(p, c)) +
        '<p class="note">お手続きの可否や必要書類はご契約内容によって異なります。' +
        'リンク先が変わっている場合は、各社の公式サイトのトップから「ご契約者さま」をお探しください。</p>' +
      '</div>' +
      '<div class="card">' + infoBlock(p) + '</div>';
  }

  function viewContact() {
    var who = tenant.agent ? tenant.agent : '担当者';
    return '<div class="card">' +
      '<h1>お問い合わせ</h1>' +
      '<p class="lead">お手続きの内容によっては、' + esc(who) + 'が一緒に確認したほうが早い場合があります。' +
      '下のボタンを押すと、LINEのトークに用件が入った状態で戻ります（送信するかはご自身で決められます）。</p>' +
      consultLink(null, null) +
      (tenant.lineId ? '' : '<p class="note">LINEのトーク画面に戻って、そのままメッセージを送ってください。</p>') +
      '</div>';
  }

  // ---- 描画とイベント ----------------------------------------------------
  function render() {
    var html;
    if (state.view === 'companies' && state.procedure) html = viewCompanies();
    else if (state.view === 'result' && state.company) html = viewResult();
    else if (state.view === 'contact' && !isPro) html = viewContact();
    else { state.view = 'top'; html = viewTop(); }

    app.innerHTML = html;
    writeUrl();

    document.querySelectorAll('.nav button').forEach(function (b) {
      var isCurrent = (b.dataset.nav === 'top' && state.view === 'top') ||
        (b.dataset.nav === 'procedures' && (state.view === 'companies' || state.view === 'result')) ||
        (b.dataset.nav === 'contact' && state.view === 'contact');
      b.setAttribute('aria-current', isCurrent ? 'true' : 'false');
    });

    bindProPanel();

    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        state.query = q.value;
        var pos = q.selectionStart;
        render();
        var q2 = document.getElementById('q');
        if (q2) { q2.focus(); q2.setSelectionRange(pos, pos); }
      });
    }
  }

  // 文面を手で直したあとに名前を入れ替えても、直した内容を消さないようにする
  var draftEdited = false;

  function bindProPanel() {
    var draft = document.getElementById('draft');
    if (!draft) return;
    draftEdited = false;

    draft.addEventListener('input', function () { draftEdited = true; });

    var who = document.getElementById('who');
    who.addEventListener('input', function () {
      customerName = who.value.trim();
      if (!draftEdited) draft.value = draftMessage(state.procedure, state.company);
    });

    document.getElementById('copy').addEventListener('click', function (e) {
      var button = e.currentTarget;
      copyText(draft, function (ok) {
        button.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
        setTimeout(function () { button.textContent = 'この文面をコピー'; }, 2000);
      });
    });

    document.getElementById('share').addEventListener('click', function () {
      // LINEの共有画面が開くので、送る相手はそこで選ぶ
      location.href = 'https://line.me/R/share?text=' + encodeURIComponent(draft.value);
    });
  }

  function copyText(textarea, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textarea.value).then(function () { done(true); }, function () { done(fallbackCopy(textarea)); });
      return;
    }
    done(fallbackCopy(textarea));
  }

  // clipboard API が使えない端末むけ。選択してからコピーする昔ながらの方法。
  function fallbackCopy(textarea) {
    try {
      textarea.focus();
      textarea.setSelectionRange(0, textarea.value.length);
      return document.execCommand('copy');
    } catch (e) {
      return false;
    }
  }

  app.addEventListener('click', function (e) {
    var swatch = e.target.closest('.palette-picker button[data-palette]');
    if (swatch) {
      tenant.palette = swatch.dataset.palette;
      document.documentElement.setAttribute('data-palette', tenant.palette);
      render();
      return;
    }
    var t = e.target.closest('[data-proc], [data-company], [data-back]');
    if (!t) return;
    if (t.dataset.proc) {
      state.procedure = byId(HOKEN.procedures, t.dataset.proc);
      state.company = null; state.query = ''; state.view = 'companies';
    } else if (t.dataset.company) {
      state.company = byId(HOKEN.companies, t.dataset.company);
      state.view = 'result';
    } else if (t.dataset.back) {
      state.view = t.dataset.back;
      if (t.dataset.back === 'top') { state.procedure = null; state.company = null; }
    }
    window.scrollTo(0, 0);
    render();
  });

  document.querySelector('.nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-nav]');
    if (!b) return;
    if (b.dataset.nav === 'contact') state.view = 'contact';
    else { state.view = 'top'; state.procedure = null; state.company = null; }
    window.scrollTo(0, 0);
    render();
  });

  document.getElementById('updated').textContent = HOKEN.checkedAt;
  applyTenant();
  readUrl();
  render();
})();
</script>
</body>
</html>
